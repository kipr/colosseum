name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CI:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run pretty

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: |
          npm run typecheck:client
          npm run typecheck:server

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

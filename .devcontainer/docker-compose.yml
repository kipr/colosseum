services:
  app:
    # Paths are relative to the primary compose file (repo-root docker-compose.yml),
    # which is first in devcontainer.json dockerComposeFile.
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        USERNAME: ${USER:-code}
        USER_HOME: ${HOME:-/home/code}
        USER_UID: ${LOCAL_UID:-1000}
        USER_GID: ${LOCAL_GID:-1000}
    # The workspace itself is bind-mounted at its host path via devcontainer.json "mounts".
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://colosseum:colosseum@postgres:5432/colosseum
      TEST_DATABASE_URL: postgres://colosseum:colosseum@postgres:5432/colosseum_test
    security_opt:
      # SELinux hosts (Fedora): allow bind mounts without relabeling
      - label=disable

# Overlay on the repo-root docker-compose.yml (first in devcontainer.json
# "dockerComposeFile"). Relative paths here resolve against that file's
# directory, i.e. the repo root.
services:
  app:
    build:
      context: .
      target: dev
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://colosseum:colosseum@postgres:5432/colosseum
      TEST_DATABASE_URL: postgres://colosseum:colosseum@postgres:5432/colosseum_test
    volumes:
      - .:/workspaces/colosseum
      - claude-config:/home/code/.claude
      - codex-config:/home/code/.codex
    security_opt:
      # The agent CLIs' bubblewrap sandbox needs user namespaces (blocked by
      # Docker's default seccomp profile) and its own /proc mount (blocked by
      # the masked system paths).
      - seccomp=unconfined
      - systempaths=unconfined

volumes:
  # Fixed names: agent logins are shared with every other devcontainer on this machine.
  claude-config:
    name: claude-config
  codex-config:
    name: codex-config

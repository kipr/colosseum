services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: colosseum
      POSTGRES_PASSWORD: colosseum
      POSTGRES_DB: colosseum
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U colosseum -d colosseum']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
